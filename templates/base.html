<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231e1e1e'/%3E%3Ctext x='32' y='44' font-family='sans-serif' font-size='40' font-weight='700' text-anchor='middle' fill='%234a90e2'%3Et;%3C/text%3E%3C/svg%3E">
    <title>{% block title %}tracker{% endblock %}</title>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="{{ url_for('index') }}" class="name">tracker;</a>
            {% if me and not forced %}
            <nav>
                <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint in ('index', 'add', 'edit') }}">Assignments</a>
                <a href="{{ url_for('groups') }}" class="{{ 'active' if request.endpoint and request.endpoint.startswith('group') }}">Groups</a>
            </nav>
            {% endif %}
        </div>
    </header>
    <main>
        <div class="{% block boxclass %}welcome-box{% endblock %}">
            {% with messages = get_flashed_messages() %}
              {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
            {% endwith %}
            {% block content %}{% endblock %}
        </div>
    </main>
    <footer>
        <div class="footer-content">
            <p>&copy; 2026 alfi; made with 💛</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='picker.js') }}" defer></script>
    <script src="{{ url_for('static', filename='menu.js') }}" defer></script>
    <script src="{{ url_for('static', filename='select.js') }}" defer></script>
    <script src="{{ url_for('static', filename='confirm.js') }}" defer></script>
    <script src="{{ url_for('static', filename='filter.js') }}" defer></script>
</body>
</html>
